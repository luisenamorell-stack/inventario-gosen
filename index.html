  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var rawEmpresa = params.get('empresa') || params.get('tienda') || params.get('cliente') || localStorage.getItem('stockmaster_active_company_id') || '';

        if (slug) {
          localStorage.setItem('stockmaster_active_company_id', slug);
        }

    })();

    window.addEventListener('unhandledrejection', function(event) {
      var reason = event && event.reason;

      var stack = reason && reason.stack || '';
      if (msg.indexOf('WebSocket closed without opened') !== -1 || stack.indexOf('@vite/client') !== -1) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);
    window.addEventListener('error', function(event) {
      var msg = (event && event.message) || '';
      var file = (event && event.filename) || '';
      if (msg.indexOf('WebSocket closed without opened') !== -1 || file.indexOf('@vite/client') !== -1) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);

        keys.forEach(function(key) {
