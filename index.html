<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="description" content="Sistema integral de control de inventario, punto de venta, compras y auditoría con escáner para Tienda Gosén." />
  <meta property="og:title" content="Tienda Gosén - Inventario y Ventas" />
  <meta property="og:description" content="Sistema integral de control de inventario, punto de venta, compras y auditoría con escáner para Tienda Gosén." />

  <meta name="application-name" content="Tienda Gosén" />
  <meta name="apple-mobile-web-app-title" content="Tienda Gosén" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="w-full h-full overflow-hidden bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root" class="h-full w-full"></div>
  <script>
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event && event.reason;
      var msg = reason && (reason.message || String(reason)) || '';
      var stack = reason && reason.stack || '';
      if (msg.indexOf('WebSocket closed without opened') !== -1 || stack.indexOf('@vite/client') !== -1) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);
    window.addEventListener('error', function(event) {
      var msg = (event && event.message) || '';
      var file = (event && event.filename) || '';
      if (msg.indexOf('WebSocket closed without opened') !== -1 || file.indexOf('@vite/client') !== -1) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        keys.forEach(function(key) {
          if (key !== 'tienda-gosen-v7') {
            caches.delete(key);
          }
        });
      });
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(
          function(reg) {
            reg.update();
          },
          function(err) {
            console.log('Tienda Gosén ServiceWorker registration failed: ', err);
          }
        );
      });
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
